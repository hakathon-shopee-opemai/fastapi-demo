# dictConfig for APP_ENV=docker: JSON to stdout only (the platform collects it),
# no local files. Selected by the logging bootstrap based on APP_ENV.
version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s %(trace_id)s %(span_id)s"
    rename_fields:
      asctime: "@timestamp"
      levelname: level
    static_fields:
      service: risk-service

filters:
  correlation:
    "()": logging.Filter        # placeholder; replaced by CorrelationIdFilter later

handlers:
  console_json:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    filters: [correlation]

loggers:
  app:
    level: INFO
    handlers: [console_json]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console_json]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console_json]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console_json]
    propagate: false
  sqlalchemy.engine:
    level: WARNING
    handlers: [console_json]
    propagate: false

root:
  level: INFO
  handlers: [console_json]
